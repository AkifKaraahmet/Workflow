<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sürec Motoru Kontrol Paneli</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #fafafa; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background-color: #fff; border-radius: 4px; }
        input, select { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; margin-top: 10px; cursor: pointer; margin-right: 10px; }
        .task-item { border: 1px solid #ddd; padding: 10px; margin-top: 5px; background: #fffbf0; }
        .btn-cancel { background-color: #e74c3c; color: white; border: none; border-radius: 4px; }
        .btn-suspend { background-color: #f39c12; color: white; border: none; border-radius: 4px; }
        .btn-resume { background-color: #2ecc71; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const url = 'http://localhost:8080';

        function App() {
            
            const [kod, setKod] = useState('izin-talebi');
            const [gun, setGun] = useState(3);
            const [isim, setIsim] = useState('Akif');
            const [baslatilanId, setBaslatilanId] = useState('');

            const [rol, setRol] = useState('yonetici');
            const [gorevler, setGorevler] = useState([]);

            
            const [surecId, setSurecId] = useState('');
            const [durum, setDurum] = useState('');
            const [tarihce, setTarihce] = useState([]);
            const [instance, setInstance] = useState(null);

            
            const gorevleriGetir = () => {
                fetch(url + '/tasks?assignee=' + rol)
                    .then(res => res.json())
                    .then(data => setGorevler(data))
                    .catch(err => console.log(err));
            };

            
            const surecBaslat = () => {
                const veri = {
                    gunSayisi: Number(gun),
                    talepEden: isim
                };
                fetch(url + '/instances/start/' + kod, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(veri)
                })
                .then(res => res.json())
                .then(data => {
                    setBaslatilanId(data.id);
                    setSurecId(data.id);
                    alert('Surec baslatildi! ID: ' + data.id);
                    gorevleriGetir();
                    gecmisGetir(data.id);
                })
                .catch(err => alert('Hata: ' + err.message));
            };

            const gorevOnayla = (id) => {
                fetch(url + '/tasks/' + id + '/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: rol
                })
                .then(res => {
                    if (res.ok) {
                        alert('Gorev onaylandi!');
                        gorevleriGetir();
                        if (surecId) gecmisGetir(surecId);
                    }
                })
                .catch(err => alert('Hata: ' + err.message));
            };

            // Gecmis sorgulama metodu
            const gecmisGetir = (id) => {
                if (!id) return;
                // Surec durumunu al
                fetch(url + '/instances/' + id)
                    .then(res => res.json())
                    .then(data => {
                        setInstance(data);
                        setDurum(data.status);
                    })
                    .catch(err => console.log(err));

                // Tarihceyi al
                fetch(url + '/instances/' + id + '/history')
                    .then(res => res.json())
                    .then(data => setTarihce(data))
                    .catch(err => console.log(err));
            };

            // 🛑 SUREC IPTAL (CANCEL) METODU
            const surecIptalEt = () => {
                fetch(url + '/instances/' + surecId + '/cancel', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            alert('Süreç başarıyla İPTAL edildi!');
                            gecmisGetir(surecId);
                        }
                    });
            };

            // ⏸️ SUREC DURDUR (SUSPEND) METODU
            const surecDurdur = () => {
                fetch(url + '/instances/' + surecId + '/suspend', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            alert('Süreç başarıyla DURDURULDU!');
                            gecmisGetir(surecId);
                        }
                    });
            };

            // ▶️ SUREC DEVAM ETTIR (RESUME) METODU
            const surecDevamEttir = () => {
                fetch(url + '/instances/' + surecId + '/resume', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            alert('Süreç başarıyla AKTİF edildi!');
                            gecmisGetir(surecId);
                        }
                    });
            };

            useEffect(() => {
                gorevleriGetir();
            }, [rol]);

            return (
                <div>
                    <h2>Süreç Motoru Kontrol Paneli</h2>

                    {/* 1. KISIM: SUREC BASLATMA */}
                    <div className="box">
                        <h3>Süreç Başlatma</h3>
                        <label>Süreç Kodu:</label>
                        <input type="text" value={kod} onChange={e => setKod(e.target.value)} />
                        
                        <label>Gün Sayısı:</label>
                        <input type="number" value={gun} onChange={e => setGun(e.target.value)} />
                        
                        <label>Talep Eden:</label>
                        <input type="text" value={isim} onChange={e => setIsim(e.target.value)} />
                        
                        <button onClick={surecBaslat}>Süreci Başlat</button>
                        {baslatilanId && <p>Başlatılan Süreç ID: <b>{baslatilanId}</b></p>}
                    </div>

                    {/* 2. KISIM: GOREV KUTUSU */}
                    <div className="box">
                        <h3>Görev Kutusu</h3>
                        <label>Rol Seç:</label>
                        <select value={rol} onChange={e => setRol(e.target.value)}>
                            <option value="yonetici">Yönetici</option>
                            <option value="ik">İnsan Kaynakları</option>
                        </select>

                        <h4>Bekleyen Onaylar ({gorevler.length})</h4>
                        {gorevler.map(t => (
                            <div key={t.id} className="task-item">
                                <p>Görev ID: {t.id} | Süreç ID: {t.processInstanceId}</p>
                                <p>Adım: {t.taskNodeId}</p>
                                <button onClick={() => gorevOnayla(t.id)}>Onayla (Approve)</button>
                            </div>
                        ))}
                    </div>

                    {/* 3. KISIM: SUREC DURUMU VE TARIHCE */}
                    <div className="box">
                        <h3>Süreç Durumu ve Tarihçe</h3>
                        <input type="number" placeholder="Süreç ID girin" value={surecId} onChange={e => setSurecId(e.target.value)} />
                        <button onClick={() => gecmisGetir(surecId)}>Sorgula</button>

                        {durum && (
                            <div style={{ marginTop: '15px', padding: '10px', backgroundColor: '#eee', borderRadius: '4px' }}>
                                <p>Mevcut Durum: <b style={{ color: durum === 'COMPLETED' ? 'green' : 'orange' }}>{durum}</b></p>
                                
                                {/* 🛠️ KONTROL BUTONLARI (CANCEL, SUSPEND, RESUME) */}
                                {durum !== 'COMPLETED' && durum !== 'CANCELLED' && (
                                    <div>
                                        <button className="btn-cancel" onClick={surecIptalEt}>Süreci İptal Et (Cancel)</button>
                                        {durum === 'SUSPENDED' ? (
                                            <button className="btn-resume" onClick={surecDevamEttir}>Süreci Devam Ettir (Resume)</button>
                                        ) : (
                                            <button className="btn-suspend" onClick={surecDurdur}>Süreci Durdur (Suspend)</button>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        <h4>İşlem Tarihçesi ({tarihce.length})</h4>
                        <ul>
                            {tarihce.map(log => (
                                <li key={log.id} style={{ marginBottom: '10px' }}>
                                    [{log.timestamp}] - <b>{log.action}</b> (Adım: {log.nodeId}) - Yapan: {log.actor} <br />
                                    <i>Detay: {log.messages}</i>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
